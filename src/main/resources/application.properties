quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=${DATASOURCE_URL:jdbc:postgresql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:5432}/${DATASOURCE_PG}?sslmode=${DATASOURCE_SSL_MODE:prefer}}
%dev.quarkus.datasource.username=${DATASOURCE_USER}
%dev.quarkus.datasource.password=${DATASOURCE_PASSWORD}

%prod.quarkus.datasource.jdbc.url=${DATASOURCE_URL:jdbc:postgresql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:5432}/${DATASOURCE_PG}?sslmode=${DATASOURCE_SSL_MODE:prefer}}
%prod.quarkus.datasource.username=${DATASOURCE_USER}
%prod.quarkus.datasource.password=${DATASOURCE_PASSWORD}

# Pool otimizado para bancos serverless (ex.: Neon) e planos Free/Starter (Render)
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.idle-removal-interval=2M
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.datasource.jdbc.validation-query-sql=SELECT 1

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.rest.multipart.input-part.default-charset=UTF-8
quarkus.swagger-ui.always-include=true

pointdapizza.jwt.issuer=point-da-pizza
pointdapizza.jwt.secret=${JWT_SECRET:point-da-pizza-dev-secret-key-2026-secure-32bytes}

# Cloudinary (fotos de usuarios e produtos)
pointdapizza.cloudinary.cloud-name=${CLOUD_NAME:}
pointdapizza.cloudinary.api-key=${CLOUD_API_KEY:}
pointdapizza.cloudinary.api-secret=${CLOUD_API_SECRET:}
pointdapizza.cloudinary.api-base-url=https://api.cloudinary.com/v1_1
pointdapizza.cloudinary.folder-prefix=point-da-pizza

# Em testes, utiliza Dev Services (PostgreSQL isolado)
%test.quarkus.datasource.devservices.enabled=true
