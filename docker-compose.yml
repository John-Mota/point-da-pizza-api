services:
  postgres:
    image: postgres:18-alpine
    container_name: point-da-pizza-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATASOURCE_PG:-point_da_pizza}
      POSTGRES_USER: ${DATASOURCE_USER:-point_pizza}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:?Defina DATASOURCE_PASSWORD no .env}
      TZ: America/Fortaleza
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USER:-point_pizza} -d ${DATASOURCE_PG:-point_da_pizza}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - point-da-pizza-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: point-da-pizza-api:latest
    container_name: point-da-pizza-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATASOURCE_HOST: postgres
      DATASOURCE_PORT: 5432
      DATASOURCE_PG: ${DATASOURCE_PG:-point_da_pizza}
      DATASOURCE_USER: ${DATASOURCE_USER:-point_pizza}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:?Defina DATASOURCE_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:-point-da-pizza-dev-secret-key-2026-secure-32bytes}
      CLOUD_NAME: ${CLOUD_NAME:-}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_API_SECRET: ${CLOUD_API_SECRET:-}
      TZ: America/Fortaleza
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - point-da-pizza-net

volumes:
  postgres_data:
    name: point-da-pizza-postgres-data

networks:
  point-da-pizza-net:
    driver: bridge
